<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - NeonTech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="glass-panel"
        style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 1200px; padding: 1rem 2rem; z-index: 100; display: flex; justify-content: space-between; align-items: center;">
        <div class="logo" style="font-weight: 800; font-size: 1.5rem; letter-spacing: -1px;">
            <a href="index.html" style="color: inherit; text-decoration: none;">NEON<span
                    style="color: var(--primary-color)">TECH</span></a>
        </div>
        <ul class="desktop-menu" style="display: flex; gap: 2rem;">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#features">Features</a></li>
            <li><a href="index.html#products">Products</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <a href="signin.html" class="btn glass-panel"
                style="color: white; padding: 0.5rem 1.5rem; border-radius: 50px; font-size: 0.9rem; text-decoration: none;">Sign
                In</a>
            <button class="btn btn-primary">Shop Now</button>
            <button id="mobile-menu-btn"
                style="background: none; border: none; color: white; cursor: pointer; display: none; font-size: 1.5rem;">
                ☰
            </button>
        </div>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu"
        style="position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; transform: translateY(-100%); transition: transform 0.3s ease;">
        <a href="index.html" class="mobile-link" style="font-size: 2rem; font-weight: 600;">Home</a>
        <a href="index.html#features" class="mobile-link" style="font-size: 2rem; font-weight: 600;">Features</a>
        <a href="index.html#products" class="mobile-link" style="font-size: 2rem; font-weight: 600;">Products</a>
        <a href="contact.html" class="mobile-link" style="font-size: 2rem; font-weight: 600;">Contact</a>
        <a href="signin.html" class="mobile-link" style="font-size: 2rem; font-weight: 600;">Sign In</a>
        <button id="close-menu-btn"
            style="position: absolute; top: 2rem; right: 2rem; background: none; border: none; color: white; font-size: 2rem; cursor: pointer;">&times;</button>
    </div>

    <section class="container"
        style="padding-top: 150px; padding-bottom: 4rem; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;">
        <h1 class="text-center mb-3 hero-title">Get in <span class="text-gradient">Touch</span></h1>

        <div class="glass-panel" style="padding: 3rem; max-width: 800px; margin: 0 auto; width: 100%;">
            <form action="#" method="POST" style="display: grid; gap: 1.5rem;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label for="name"
                            style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Name</label>
                        <input type="text" id="name" name="name" required placeholder="John Doe" class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="email"
                            style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Email</label>
                        <input type="email" id="email" name="email" required placeholder="john@example.com"
                            class="form-input">
                    </div>
                </div>

                <div class="form-group">
                    <label for="subject"
                        style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Subject</label>
                    <input type="text" id="subject" name="subject" required placeholder="How can we help?"
                        class="form-input">
                </div>

                <div class="form-group">
                    <label for="message"
                        style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Your message here..."
                        class="form-input"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Send
                    Message</button>
            </form>
        </div>

        <div style="text-align: center; margin-top: 3rem; color: var(--text-secondary);">
            <p>Email: support@neontech.com</p>
            <p>Phone: +1 (555) 123-4567</p>
            <p>Address: 123 Future Blvd, Tech City, TC 90210</p>
        </div>
    </section>

    <footer style="background: var(--surface-color); padding: 4rem 0; margin-top: auto;">
        <div class="container" style="text-align: center; color: var(--text-secondary);">
            <p>&copy; 2024 NeonTech. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="main.js"></script>
</body>

</html>
